services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_PASSWORD:-YourSecurePassword123!}
      MSSQL_PID: "Developer"
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - ./output:/var/opt/mssql/output
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_USER: sa
      MSSQL_PASSWORD: ${MSSQL_PASSWORD:-YourSecurePassword123!}
      MSSQL_DB: ${MSSQL_DB:-online_store}
      MSSQL_HOST: db
      MSSQL_PORT: 1433
      MPLBACKEND: Agg
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./charts:/app/charts

volumes:
  mssql_data:
